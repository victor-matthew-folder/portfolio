<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victor Matthew | AI Automation Specialist</title>
<meta name="description" content="AI automation specialist and automation systems consultant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#top" id="logo"></a>
  <nav aria-label="Main"><a href="#work">Work</a><a href="#video" id="nav-video">Demo</a><a href="#calc">Calculator</a><a href="#contact">Contact</a></nav>
</div></header>

<main id="top">
  <div class="wrap hero">
    <div>
      <h1 id="headline"></h1>
      <p class="lead" id="about"></p>
      <p class="role" id="role"></p>
      <a class="btn" href="#contact">Book a free automation audit</a>
    </div>
    <img id="photo" class="photo" alt="Portrait of the site owner" width="320" height="320">
  </div>

  <section id="work"><div class="wrap">
    <h2>Case studies</h2>
    <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
    <div class="builds" id="projects"></div>
  </div></section>

  <section id="video"><div class="wrap">
    <h2 id="video-title">Demo</h2>
    <div class="video" id="video-box"></div>
  </div></section>

  <section id="calc"><div class="wrap">
    <h2>How much time could automation give back?</h2>
    <p>Enter one repetitive task. This is your own estimate, not a promise.</p>
    <div class="calc">
      <label>Times the task happens per week <input type="number" id="c-count" min="0" value="20"></label>
      <label>Minutes each time <input type="number" id="c-min" min="0" value="10"></label>
      <p class="result" aria-live="polite" id="c-out"></p>
    </div>
  </div></section>

  <section id="contact"><div class="wrap">
    <h2>Tell me what you want to automate</h2>
    <!-- Must stay in the HTML (not built by JavaScript) so Netlify can detect it at deploy time. -->
    <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" id="form">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Leave empty <input name="bot-field"></label></p>
      <label>Your name <input type="text" name="name" required autocomplete="name"></label>
      <label>Email <input type="email" name="email" required autocomplete="email"></label>
      <label>What would you like to automate? <textarea name="message" required></textarea></label>
      <button class="btn" type="submit">Send message</button>
      <p class="status" id="form-status" role="status"></p>
    </form>
  </div></section>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
